<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}TableTop{% endblock %}</title>
  <link rel="icon" href="{{url_for('static', filename='images/logo.png')}}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<style>
  .restaurant-page-img {
    width: 500px;
    height: 300px;
    object-fit: cover;
  }
</style>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/staff/ui/home"><img src="{{url_for('static', filename='images/logo.png')}}" alt=""
          width="30" height="24" class="d-inline-block align-text-top"> TopTable</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02"
        aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/staff/ui/home">Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast w-auto" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <i class="fa fa-circle-plus"></i>
        <strong class="me-auto ms-1">New Reservation Received</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">
        <!-- Extra fields that are meant to be hidden-->
        <input type="hidden" id="reservationId" value="">
        <input type="hidden" id="senderEmail" value="">
        <input type="hidden" id="receiptHandle" value="">
        <input type="hidden" id="restaurantId" value="">

        <table class="table table-borderless px-5">
          <thead>
            <tr>
              <th scope="col">Table number</th>
              <th scope="col">Reservation code</th>
              <th scope="col">Restaurant name</th>
              <th scope="col">Number of people</th>
              <th scope="col">Start time</th>
              <th scope="col">End time</th>
              <th scope="col">Special Requests</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="table number"></td>
              <td id="reservation code"></td>
              <td id="restaurant name"></td>
              <td id="number people"></td>
              <td id="start time"></td>
              <td id="end time"></td>
              <td id="special requests"></td>
            </tr>
          </tbody>
        </table>

        <div class="d-flex flex-column">
          <div class="p-0 d-flex flex-row justify-content-center">
            <button onclick="acceptReservation()" type="button" class="btn btn-success me-2" id="accept"><i
                class="fa fa-check"></i> Accept</button>
            <button onclick="denyReservation()" type="button" class="btn btn-danger" id="accept"><i
                class="fa fa-ban"></i> Deny</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script>
    
    const isProduction= window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
    const socketPath = isProduction ? '/staff/socket.io' : '/socket.io';
    const socket = io({path:socketPath});


    socket.on('reservation_request', (data) => {
      console.log(data);
      const toastElement = document.getElementById('liveToast');
      const toast = new bootstrap.Toast(toastElement,{autohide:false});

      const tableNumberElement = document.getElementById('table number');
      const reservationCodeElement = document.getElementById('reservation code');
      const restaurantNameElement = document.getElementById('restaurant name');
      const numberOfPeopleElement = document.getElementById('number people');
      const startTimeElement = document.getElementById('start time');
      const endTimeElement = document.getElementById('end time');
      const specialRequestsElement = document.getElementById('special requests');

      const reservationIdHidden = document.getElementById('reservationId');
      const senderEmail = document.getElementById('senderEmail');
      const receiptHandle = document.getElementById('receiptHandle');
      const restaurantId = document.getElementById('restaurantId');

      tableNumberElement.innerText = data.table.table_number;
      reservationCodeElement.innerText = data.reservation.reservation_code;
      restaurantNameElement.innerText = data.restaurant.name;
      numberOfPeopleElement.innerText = data.reservation.number_of_people;
      startTimeElement.innerText = formatDateTime(data.reservation.reservation_start_time);
      endTimeElement.innerText = formatDateTime(data.reservation.reservation_end_time);
      specialRequestsElement.innerText = data.reservation.special_requests || "None";

      reservationIdHidden.value = data.reservation.id;
      senderEmail.value = data.sender_email;
      receiptHandle.value = data.receipt_handle;
      restaurantId.value = data.restaurant_id;
      toast.show();
    });


    socket.on("not authenticated", (data) => {
      console.log("user is not authenticated");
    })


    function acceptReservation() {
      console.log("accepting reservation");
      const reservationId = document.getElementById('reservationId').value;
      const senderEmail = document.getElementById('senderEmail').value;
      const receiptHandle = document.getElementById('receiptHandle').value;
      const restaurantId = document.getElementById('restaurantId').value;

      console.log('confirm_reservation', { "reservation_id": reservationId, "sender_email": senderEmail, "receipt_handle": receiptHandle, "restaurant_id": restaurantId })
      socket.emit('confirm_reservation', { "reservation_id": reservationId, "sender_email": senderEmail, "receipt_handle": receiptHandle, "restaurant_id": restaurantId });
    }

    function denyReservation() {
      const reservationId = document.getElementById('reservationId').value;
      const senderEmail = document.getElementById('senderEmail').value;
      const receiptHandle = document.getElementById('receiptHandle').value;
      const restaurantId = document.getElementById('restaurantId').value;

      socket.emit('cancel_reservation', { "reservation_id": reservationId, "sender_email": senderEmail, "receipt_handle": receiptHandle, "restaurant_id": restaurantId });
    }

    function formatDateTime(dateTimeString) {
      const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      return new Date(dateTimeString).toLocaleString([], options);
    }
    console.log("starting listen");

  </script>

  {% block scripts %}{% endblock %}
</body>
